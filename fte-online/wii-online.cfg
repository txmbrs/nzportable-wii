// Initial online profile. Keep separate from the solo port's configuration.
vid_renderer gl
vid_width 640
vid_height 480
vid_fullscreen 1
cl_maxfps 60
cl_nocsqc 0
com_protocolname "NZP-REBOOT-WEB NZP-REBOOT"
net_ice_broker "tls://master.frag-net.com:27950"
// Leave room for SCTP + DTLS + UDP/IP headers on a 1200-byte DTLS path.
net_mtu 1000
name "Wii Soldier"
bind GP_A "impulse 10"
bind GP_B "impulse 22"
bind GP_X "+button5"
bind GP_Y "+button4"
bind GP_LTRIGGER "+button8"
bind GP_RTRIGGER "+attack"
bind GP_LSHOULDER "+button7"
bind GP_RSHOULDER "+button3"
bind GP_START "togglemenu"
bind GP_DPAD_UP "impulse 23"
bind GP_DPAD_DOWN "+button6"
bind GP_DPAD_LEFT "+button7"
bind GP_DPAD_RIGHT "showscores"
